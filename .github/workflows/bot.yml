name: OLX Bot

on:
  schedule:
    - cron: '*/15 * * * *' # Uruchamiaj co 15 minut
  workflow_dispatch: # Pozwala uruchomić bota ręcznie z poziomu przeglądarki

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Pozwala botowi zapisywać plik z zapamiętanymi linkami
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Uruchomienie bota
        run: python bot.py

      - name: Zapisanie wysłanych ofert do repozytorium
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wyslane.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizacja wysłanych ofert" && git push)
